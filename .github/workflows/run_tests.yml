name: Unit tests

on:
  push:
    branches:
      - master
      - android-10
  pull_request:
    branches:
      - master
      - android-10

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v4
    # Robolectric 4.4 can't read Java 17 class files, so tests run on Java 11 like
    # they did when this release was made; APKs are built with Java 17
    - name: Setup java 11
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '11'
    - name: Execute tests
      run: |
        ./gradlew test
